# Reverse proxy: one public origin, three processes behind it.
#
# The socket gateway is served under /realtime on the SAME origin. That is
# what makes the session cookie reach it — a cookie set on the console's
# host is not sent to a different host or port.

upstream cleo_web      { server 127.0.0.1:3000; keepalive 32; }
upstream cleo_realtime { server 127.0.0.1:4001; keepalive 16; }

server {
    listen 443 ssl http2;
    server_name booknow.example.com;

    # ssl_certificate     /etc/letsencrypt/live/.../fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/.../privkey.pem;

    client_max_body_size 12M;   # reference images are capped at 10M

    # ── Admin surface: allow-list before anything else ─────────────────
    location /admin {
        # allow 203.0.113.0/24;   # office
        # deny all;
        proxy_pass http://cleo_web;
        include /etc/nginx/proxy_params;
    }

    # ── Socket gateway ─────────────────────────────────────────────────
    location /realtime {
        proxy_pass http://cleo_realtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Sockets are long-lived; do not time them out at 60s.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Webhooks: never cached, real client IP preserved ───────────────
    location /api/webhooks/ {
        proxy_pass http://cleo_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        proxy_pass http://cleo_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
